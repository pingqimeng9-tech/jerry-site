<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Jerry CMS · Studio</title>
<link rel="stylesheet" href="./admin.css">
<script src="/admin/studio/cms-adapter.js"></script>
<script src="/admin/admin-auth.js"></script>
<script src="/admin/studio/uploader.js"></script>
<script src="/admin/studio/component-runtime.js"></script>
<script src="/admin/studio/components/background.js"></script>
<script src="/admin/studio/components/profile.js"></script>
<script src="/admin/studio/components/music.js"></script>
<style>
  .studio-shell{display:grid;grid-template-columns:236px minmax(0,1fr) 330px;gap:14px;height:100vh;padding:14px;overflow:hidden}
  .studio-left,.studio-right{display:flex;flex-direction:column;min-height:0;border:1px solid var(--glass-border);border-radius:18px;background:rgba(16,13,38,.7);backdrop-filter:blur(18px);overflow:hidden}
  .studio-center{display:flex;flex-direction:column;min-width:0;min-height:0}
  .studio-panel-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800;flex:none}
  .studio-panel-head span{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--aqua);letter-spacing:.14em;text-transform:uppercase}
  .studio-left-nav{display:flex;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line);flex:none}
  .studio-left-nav a{flex:1;text-align:center;padding:6px 4px;border-radius:8px;color:var(--muted);font-size:10.5px;text-decoration:none;border:1px solid transparent}
  .studio-left-nav a:hover{color:#fff;background:rgba(255,255,255,.07);border-color:var(--line)}
  .studio-palette{padding:12px;display:flex;flex-direction:column;gap:9px;overflow:auto}
  .comp-card{position:relative;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.045);cursor:pointer;transition:.16s}
  .comp-card:hover{border-color:rgba(92,225,230,.4);background:rgba(92,225,230,.055)}
  .comp-card.selected{border-color:rgba(177,140,255,.65);background:rgba(177,140,255,.09);box-shadow:0 0 0 2px rgba(177,140,255,.12)}
  .comp-card .cc-top{display:flex;align-items:center;gap:8px}
  .comp-card .cc-icon{font-size:18px}
  .comp-card b{font-size:13px;flex:1;min-width:0}
  .comp-card .cc-desc{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:5px}
  .comp-card .cc-toggle{width:15px;height:15px;accent-color:var(--aqua);cursor:pointer}
  .comp-card .cc-ver{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:7px}
  .studio-note{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.65;flex:none}
  .studio-toolbar{display:flex;align-items:center;gap:8px;padding:9px 11px;margin-bottom:10px;border:1px solid var(--glass-border);border-radius:14px;background:rgba(16,13,38,.72);backdrop-filter:blur(16px);flex-wrap:wrap;flex:none}
  .studio-toolbar .grow{flex:1}
  .device-switch{display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(0,0,0,.24)}
  .device-switch button{border:0;background:none;color:var(--muted);border-radius:8px;padding:6px 11px;font:700 11.5px inherit;cursor:pointer}
  .device-switch button.on{background:rgba(92,225,230,.16);color:var(--aqua)}
  .tools-spacer{width:1px;height:22px;background:var(--line);margin:0 2px}
  .studio-center .btn{padding:8px 14px;font-size:12px}
  #saveState{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  #saveState.dirty{color:var(--warn)}
  .studio-canvas-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:auto;padding:0 4px 4px}
  .studio-canvas{position:relative;width:100%;max-width:100%;border:1px solid var(--glass-border);border-radius:20px;overflow:hidden;background:#0e0c22;box-shadow:0 26px 80px -34px #000;transition:max-width .25s ease}
  .studio-canvas.mobile{max-width:390px}
  #studioBg{position:absolute;inset:0;z-index:0;transition:background .25s ease}
  .studio-bg-image{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;filter:saturate(1.1) brightness(.85)}
  .studio-bg-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .studio-bg-fx i{position:absolute;display:block;width:6px;height:6px;border-radius:50%;background:#fff8;animation:studioFloat linear infinite}
  .studio-bg-fx.fx-sakura i{background:#FFB7D5;border-radius:60% 40% 60% 40%}
  .studio-bg-fx.fx-snow i{width:4px;height:4px;background:#fff}
  .studio-bg-fx.fx-fireflies i{background:#FFE08A;box-shadow:0 0 10px #FFD166}
  @keyframes studioFloat{0%{transform:translate3d(0,-10px,0)}50%{transform:translate3d(14px,40px,0)}100%{transform:translate3d(-10px,110vh,0)}}
  .studio-page{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;min-height:540px;color:#fff}
  .studio-nav{display:flex;align-items:center;gap:18px;padding:15px 22px;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(10,8,26,.28);backdrop-filter:blur(12px);font-size:12px}
  .studio-nav b{font-family:var(--mono);font-size:13px;letter-spacing:.02em}
  .studio-nav span{color:#d6d2eb;opacity:.8}
  .studio-nav span:first-of-type{margin-left:auto}
  .studio-body{flex:1;display:flex;gap:22px;padding:26px clamp(18px,4vw,44px);align-items:flex-start;min-height:0}
  .studio-profile{width:210px;flex:none}
  .studio-content{flex:1;min-width:0;align-self:center}
  .studio-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:#9cf3ff;margin-bottom:10px}
  .studio-content h2{font-family:'Noto Serif SC',serif;font-size:clamp(26px,4.2vw,52px);line-height:1.18;margin:0 0 12px;max-width:620px;text-shadow:0 8px 30px #0007}
  .studio-content p{font-size:14px;line-height:1.8;color:#dedbf1;max-width:520px;margin:0 0 24px}
  .studio-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px}
  .studio-cards i{display:block;height:88px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(10px)}
  .studio-profile-card{padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(16,14,36,.42);backdrop-filter:blur(14px);text-align:center;box-shadow:0 18px 40px -28px #000}
  .sp-avatar{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#B18CFF,#5CE1E6);color:#17112a;font-family:'Noto Serif SC',serif;font-weight:900;font-size:22px}
  .sp-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .sp-profile-name{font-weight:800;font-size:15px}
  .sp-profile-bio{font-size:11.5px;color:#d5d1e8;line-height:1.6;margin-top:4px}
  .sp-profile-link{display:inline-block;margin-top:9px;color:#8ff0f4;font-size:11px;text-decoration:none;border-bottom:1px dashed rgba(92,225,230,.4)}
  .inspector{flex:1;overflow:auto;padding:14px}
  .studio-right-foot{flex:none;padding:12px 14px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.65;color:var(--muted)}
  .inspector-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .inspector-head .inspector-icon{font-size:22px}
  .inspector-head b{display:block;font-size:13.5px}
  .inspector-head span{display:block;font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:2px}
  .inspector-head code{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--aqua)}
  .cms-field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .cms-field>label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cms-field input[type=text],.cms-field textarea,.cms-field select{width:100%;background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:#fff;font:inherit;font-size:12px;outline:none}
  .cms-field input[type=text]:focus,.cms-field textarea:focus,.cms-field select:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(92,225,230,.12)}
  .cms-field textarea{resize:vertical;line-height:1.65}
  .cms-field input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.26);padding:4px;cursor:pointer}
  .cms-range{display:flex;align-items:center;gap:9px}
  .cms-range input{flex:1;accent-color:var(--aqua)}
  .cms-range-value{font-family:var(--mono);font-size:10.5px;color:var(--aqua);min-width:34px;text-align:right}
  .studio-music-card{display:flex;align-items:center;gap:9px;margin-top:12px;padding:11px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);text-align:left}
  .studio-music-card .sm-cover{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 200deg,#2b2b36,#B18CFF,#2b2b36);border:1px solid rgba(255,255,255,.25);font-size:14px;flex:none}
  .studio-music-card .sm-meta{min-width:0;flex:1}
  .studio-music-card .sm-meta b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .studio-music-card .sm-meta span{display:block;font-size:9.5px;color:#d5d1e8;margin-top:2px}
  .studio-music-card .sm-play{font-size:11px;color:#9cf3ff;font-weight:800}
  .cms-field-switch{flex-direction:row;align-items:center;justify-content:space-between}
  .cms-switch{position:relative;width:42px;height:24px;display:inline-flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.12);transition:.2s}
  .cms-switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
  .cms-switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .cms-switch:has(input:checked){background:var(--aqua)}
  .cms-switch:has(input:checked)::after{transform:translateX(18px)}
  .cms-image-field{display:flex;gap:7px;flex-wrap:wrap}
  .cms-image-field input{flex:1;min-width:120px}
  .cms-image-field .btn{padding:8px 10px;font-size:11px}
  .cms-image-preview{width:100%;height:74px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted)}
  @media(max-width:1100px){.studio-shell{grid-template-columns:200px minmax(0,1fr) 290px;gap:10px;padding:10px}}
  @media(max-width:860px){
    .studio-shell{display:flex;flex-direction:column;height:auto;min-height:100dvh;overflow:visible;padding:10px}
    .studio-left,.studio-right{overflow:visible}
    .studio-palette{flex-direction:row;overflow-x:auto;gap:8px}
    .comp-card{min-width:200px}
    .studio-center{min-height:70vh}
    .studio-toolbar{position:sticky;top:0;z-index:20}
    .studio-canvas{min-height:480px}
    .studio-body{flex-direction:column;gap:14px;padding:18px}
    .studio-profile{width:100%;max-width:240px}
    .studio-content h2{font-size:30px}
    .studio-cards{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="studio-shell">
  <aside class="studio-left">
    <div class="studio-left-nav"><a href="index.html">← 控制台</a><a href="templates.html">模板库</a><a href="settings.html">设置</a></div>
    <div class="studio-panel-head">🧩 组件库 <span id="compCount">0</span></div>
    <div class="studio-palette" id="palette"></div>
    <div class="studio-note">组件由统一定义注册，配置由 schema 自动生成。当前版本包含背景和站点资料卡；后续可继续注册音乐、素材、模板卡片等组件。</div>
  </aside>

  <main class="studio-center">
    <div class="studio-toolbar">
      <div class="device-switch" role="group" aria-label="预览设备">
        <button type="button" class="on" data-device="desktop">▭ 桌面</button>
        <button type="button" data-device="mobile">▯ 手机</button>
      </div>
      <span class="tools-spacer"></span>
      <span id="saveState">未修改</span>
      <button type="button" class="btn ghost" id="btnReset">还原</button>
      <button type="button" class="btn primary" id="btnSave">保存并发布</button>
    </div>
    <div class="studio-canvas-wrap">
      <div class="studio-canvas" id="studioPreview">
        <div id="studioBg"></div>
        <div class="studio-page">
          <div class="studio-nav"><b id="previewSite">JERRY.DEV</b><span>首页</span><span>博客</span><span>项目</span><span>友链</span></div>
          <div class="studio-body">
            <aside class="studio-profile" id="studioProfile"><div id="studioMusic"></div></aside>
            <section class="studio-content">
              <div class="studio-kicker">JERRY / STUDIO PREVIEW</div>
              <h2 id="previewHero">用组件搭建你的站点</h2>
              <p id="previewSub">背景、资料卡和更多组件都可以在这里切换。右侧属性由组件 schema 自动生成，保存后直接写入站点配置。</p>
              <div class="studio-cards"><i></i><i></i><i></i></div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>

  <aside class="studio-right">
    <div class="studio-panel-head">🎛 属性检查器 <span>LIVE</span></div>
    <div class="inspector" id="inspector"></div>
    <div class="studio-right-foot" id="saveHint">保存后会写入 <code>site.config.json</code> 并自动发布。背景与资料卡会同步影响博客、友链、项目等使用 site-kit 的页面。</div>
  </aside>
</div>
<div class="pic-toast" id="toast"></div>

<script>
(function () {
  const state = {
    full: {},
    bg: null,
    profile: null,
    music: null,
    layout: { format: 'jerry-studio/v1', components: [] },
    selected: 'background',
    device: 'desktop',
    dirty: false,
    saving: false
  };
  const bgComp = window.JerryComponents.get('background');
  const profileComp = window.JerryComponents.get('profile');
  const musicComp = window.JerryComponents.get('music');

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2400);
  }
  function setSaveState(text, dirty) {
    const el = document.getElementById('saveState');
    el.textContent = text;
    el.classList.toggle('dirty', !!dirty);
  }
  function markDirty() {
    state.dirty = true;
    setSaveState('● 未保存', true);
  }
  function isEnabled(id) {
    const entry = state.layout.components.find(c => c.id === id);
    return !entry || entry.enabled !== false;
  }
  function setEnabled(id, enabled) {
    let entry = state.layout.components.find(c => c.id === id);
    if (!entry) {
      entry = { id: id, slot: (window.JerryComponents.get(id) || {}).slot || 'page', enabled: true };
      state.layout.components.push(entry);
    }
    entry.enabled = !!enabled;
    markDirty();
    renderAll();
  }
  function bgPreviewStyle() {
    if (!state.bg) return {};
    const color = state.bg.color || '#0e0c22';
    const accent = state.bg.accent || '#6A5CFF';
    if (state.bg.useGradient === false || state.bg.style === 'solid') return { background: color };
    if (state.bg.style === 'mesh') {
      return { background: 'radial-gradient(circle at 18% 22%, ' + accent + '88, transparent 42%), radial-gradient(circle at 82% 18%, #FF8CD955, transparent 45%), radial-gradient(circle at 70% 80%, #5CE1E655, transparent 45%), ' + color };
    }
    if (state.bg.style === 'grid') {
      return { backgroundColor: color, backgroundImage: 'radial-gradient(' + accent + '66 1px, transparent 1.5px)', backgroundSize: '18px 18px' };
    }
    return { background: 'radial-gradient(circle at 50% 28%, ' + accent + '66, transparent 55%), radial-gradient(circle at 14% 82%, #5CE1E644, transparent 45%), radial-gradient(circle at 86% 72%, #FF8CD933, transparent 48%), ' + color };
  }
  function renderPreview() {
    const bgEl = document.getElementById('studioBg');
    if (isEnabled('background')) {
      bgComp.render(bgEl, state.bg);
    } else {
      bgEl.innerHTML = '';
      bgEl.style.cssText = '';
      bgEl.style.background = '#0e0c22';
    }
    const profileEl = document.getElementById('studioProfile');
    if (isEnabled('profile')) profileComp.render(profileEl, state.profile);
    else profileEl.innerHTML = '';
    const musicEl = document.getElementById('studioMusic');
    if (musicEl) {
      if (isEnabled('music')) musicComp.render(musicEl, state.music);
      else musicEl.innerHTML = '';
    }
    document.getElementById('previewSite').textContent = state.profile.siteName || 'JERRY.DEV';
    document.getElementById('previewHero').textContent = state.profile.bio ? state.profile.bio : '用组件搭建你的站点';
    document.getElementById('previewSub').textContent = (state.profile.authorName || 'Jerry') + ' · 这是 Studio 的实时预览，保存后会同步到站点配置。';
  }
  function renderPalette() {
    const box = document.getElementById('palette');
    box.innerHTML = '';
    const comps = window.JerryComponents.list();
    document.getElementById('compCount').textContent = comps.length;
    comps.forEach(comp => {
      const card = document.createElement('div');
      card.className = 'comp-card' + (state.selected === comp.id ? ' selected' : '');
      card.dataset.id = comp.id;
      card.innerHTML =
        '<div class="cc-top"><span class="cc-icon">' + (comp.icon || '🧩') + '</span><b>' + comp.name + '</b>' +
        '<input type="checkbox" class="cc-toggle" ' + (isEnabled(comp.id) ? 'checked' : '') + ' aria-label="启用 ' + comp.name + '"></div>' +
        '<div class="cc-desc">' + (comp.description || '') + '</div>' +
        '<div class="cc-ver">' + comp.id + ' · v' + (comp.version || '1.0.0') + ' · slot: ' + (comp.slot || 'page') + '</div>';
      card.addEventListener('click', function (event) {
        if (event.target.classList.contains('cc-toggle')) return;
        state.selected = comp.id;
        renderPalette();
        renderInspector();
      });
      const toggle = card.querySelector('.cc-toggle');
      toggle.addEventListener('change', function (event) {
        event.stopPropagation();
        setEnabled(comp.id, toggle.checked);
      });
      box.appendChild(card);
    });
  }
  function renderInspector() {
    const comp = window.JerryComponents.get(state.selected);
    const box = document.getElementById('inspector');
    if (!comp) { box.innerHTML = '<div class="studio-note">没有选中组件。</div>'; return; }
    const configMap = { background: state.bg, profile: state.profile, music: state.music };
    const config = configMap[state.selected];
    window.JerryComponents.renderInspector(box, comp, config, function (key, value) {
      window.JerryComponents.setPath(config, key, value);
      markDirty();
      renderPreview();
      if (state.selected === 'profile') {
        document.getElementById('previewSite').textContent = state.profile.siteName || 'JERRY.DEV';
      }
    });
  }
  function renderAll() {
    renderPalette();
    renderInspector();
    renderPreview();
  }
  async function load() {
    setSaveState('加载中…', false);
    try {
      const r = await fetch('/api/config', { cache: 'no-store' });
      const d = await r.json();
      const cfg = (d && d.config) || {};
      state.full = cfg;
      state.bg = bgComp.fromSection(cfg.background || {});
      state.profile = profileComp.fromSection(cfg.profile || {});
      state.music = musicComp.fromSection(cfg.music || {});
      const studio = cfg.studio && cfg.studio.format === 'jerry-studio/v1' ? cfg.studio : null;
      state.layout = studio ? { format: 'jerry-studio/v1', components: Array.isArray(studio.components) ? studio.components.slice() : [] } : {
        format: 'jerry-studio/v1',
        components: [
          { id: 'background', slot: 'page', enabled: true },
          { id: 'profile', slot: 'sidebar', enabled: true },
          { id: 'music', slot: 'floating', enabled: true }
        ]
      };
      ['background', 'profile', 'music'].forEach(function (id) {
        if (!state.layout.components.some(function (c) { return c.id === id; })) {
          state.layout.components.push({ id: id, slot: id === 'profile' ? 'sidebar' : (id === 'music' ? 'floating' : 'page'), enabled: true });
        }
      });
      state.dirty = false;
      renderAll();
      setSaveState('已同步', false);
    } catch (e) {
      setSaveState('加载失败', false);
      toast('配置加载失败：' + e.message);
    }
  }
  async function save() {
    if (state.saving) return;
    state.saving = true;
    document.getElementById('btnSave').disabled = true;
    setSaveState('保存中…', true);
    try {
      const ops = [
        { section: 'background', label: '背景', data: bgComp.toSection(state.bg, state.full.background || {}) },
        { section: 'profile', label: '站点资料', data: profileComp.toSection(state.profile, state.full.profile || {}) },
        { section: 'music', label: '全站音乐', data: musicComp.toSection(state.music, state.full.music || {}) },
        { section: 'studio', label: 'Studio 布局', data: { format: 'jerry-studio/v1', updatedAt: new Date().toISOString(), components: state.layout.components } }
      ];
      for (const op of ops) {
        const r = await fetch('/api/config/stage', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(op)
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || '暂存失败');
      }
      const result = await fetch('/api/config/apply', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
      }).then(r => r.json());
      if (!result.ok) throw new Error(result.error || '保存失败');
      state.full.background = ops[0].data;
      state.full.profile = ops[1].data;
      state.full.music = ops[2].data;
      state.full.studio = ops[3].data;
      state.dirty = false;
      setSaveState('已保存', false);
      toast('✅ 已保存并发布，约 1-2 分钟线上生效');
    } catch (e) {
      setSaveState('保存失败', true);
      toast('保存失败：' + e.message);
    } finally {
      state.saving = false;
      document.getElementById('btnSave').disabled = false;
    }
  }
  document.getElementById('btnSave').addEventListener('click', save);
  document.getElementById('btnReset').addEventListener('click', function () {
    if (state.dirty && !confirm('放弃未保存的修改，重新读取线上配置？')) return;
    load();
  });
  document.querySelectorAll('[data-device]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.device = btn.dataset.device;
      document.querySelectorAll('[data-device]').forEach(b => b.classList.toggle('on', b === btn));
      document.getElementById('studioPreview').classList.toggle('mobile', state.device === 'mobile');
    });
  });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.__studioState = state;
  load();
})();
</script>
</body>
</html>
