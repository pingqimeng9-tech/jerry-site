<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jerry-site</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1b1b1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jerry-site">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="/assets/pwa-install.js" defer></script>
<script src="/assets/capsule-player.js" data-player-only defer></script>
<script src="/assets/layout.js" defer></script>
<script src="/assets/home-layout.js" defer></script>
<!--
  创意网站模板库 v2 —— 照着 carterogunsola.com/lab 复刻
  SHELL（外壳） / 工具 / CONTENT（内容） / 模板（每个 registerTemplate 一块，自带 css、knobs、notes）
  新增模板：registerTemplate({id,name,cat,mat,spell,core,tags,credit,notes,knobs,css,mount(h,ctx){...}})
  ctx：items 内容数组 · P 参数对象（旋钮实时改它）· auto 是否预览自动演示 · status/hint/focus/demo
-->
<link rel="stylesheet" href="/assets/index.css" data-index-source>
</head>
<body data-page="index">
<div class="grain"></div><div class="dots"></div>

<nav class="mnav" aria-label="主导航">
  <button class="mn-brand" id="mbrand" aria-label="Jerry-site 首页"><span class="mn-ic" aria-hidden="true"><b></b><b></b><b></b></span><span class="mn-name">JERRY-SITE</span></button>
  <div class="mn-links">
    <button id="mhome" aria-current="page">首页</button>
    <a href="blog.html">博客</a>
    <a href="rumi.html">Rumi英语</a>
    <a href="friends.html">友链</a>
    <a href="projects.html">项目</a>
  </div>
  <div class="mn-cta" id="msw" role="group" aria-label="切换配色"></div>
</nav>

<header class="bar" data-module="topbar">
  <nav class="nav" id="nav" aria-label="分类"></nav>
</header>

<main id="stage" data-module="template-stage"></main>
<section class="gal" id="gal" hidden aria-label="模板画廊"></section>

<div class="mdl" id="mdl" hidden data-module="template-dialog">
  <div class="mdl-box" role="dialog" aria-modal="true" aria-label="模板详情">
    <header><div><div class="mdl-cat"></div><h2 class="mdl-t"></h2></div><div class="mdl-r"><a class="mdl-src" id="msrc" target="_blank" rel="noopener noreferrer" hidden></a><button class="mdl-x" id="mx" aria-label="关闭">✕</button></div></header>
    <div class="mdl-bar">
      <div class="mdl-seg" role="tablist" aria-label="视图">
        <button data-v="preview" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview</button>
        <button data-v="code" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>Code</button>
      </div>
      <div class="ai">
        <button class="ai-btn" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span>Copy for AI</span><i aria-hidden="true">▾</i></button>
        <div class="ai-menu" role="menu" hidden>
          <button data-a="p1" role="menuitem"><em>✦</em><span>复制提示词（做同款）</span></button>
          <button data-a="p2" role="menuitem"><em>✎</em><span>复制提示词（改造成我的）</span></button>
          <button data-a="p3" role="menuitem"><em>›_</em><span>复制 Claude Code 提示词</span></button>
          <button data-a="html" role="menuitem"><em>▤</em><span>复制配置好的完整代码</span></button>
          <button data-a="tsx" role="menuitem"><em>⟨⟩</em><span>复制 React 组件源码</span></button>
          <hr>
          <button data-a="link" role="menuitem"><em>⛓</em><span>复制链接</span></button>
          <button data-a="pen" role="menuitem"><em>↗</em><span>在 CodePen 打开</span></button>
          <button data-a="open" role="menuitem"><em>⤢</em><span>放大预览</span></button>
        </div>
      </div>
    </div>
    <div class="mdl-view" data-v="preview">
      <div class="mdl-main">
        <div class="mdl-pv">
          <button class="mdl-zoom" type="button" aria-label="放大预览" title="放大预览"><span aria-hidden="true">⤢</span></button>
        </div>
        <aside class="mdl-side">
          <p class="mdl-spell"></p>
          <div class="mdl-tags"></div>
          <section class="cz" aria-label="Customize">
            <div class="cz-h"><b>Customize</b><button id="czr" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reset</button></div>
            <div class="mdl-tune"></div>
          </section>
          <details class="mdl-nt" open><summary>Notes</summary><div class="mdl-notes"></div></details>
        </aside>
      </div>
    </div>
    <div class="mdl-view" data-v="code" hidden>
      <section class="cp" id="cp" aria-label="代码">
        <div class="cp-tabs" role="tablist"></div>
        <div class="cp-bar"><span><b class="cp-file"></b> · <span class="cp-meta"></span></span><div><button data-a="save">下载</button><button data-a="copy">复制</button></div></div>
        <div class="cp-code" tabindex="0" aria-label="代码内容"></div>
        <p class="cp-note"></p>
      </section>
    </div>
  </div>
</div>

<div class="dock" data-module="template-dock">
  <div class="hint" id="hint"></div>
  <div class="chips" id="chips" aria-label="模板"></div>
</div>

<script src="/assets/index-runtime.js"></script>
<script src="/admin/studio/bridge.js" defer></script>
</body>
</html>
