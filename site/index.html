<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jerry-site</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1b1b1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jerry-site">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script src="/assets/pwa-install.js" defer></script>
<script src="/assets/capsule-player.js" data-player-only defer></script>
<!--
  创意网站模板库 v2 —— 照着 carterogunsola.com/lab 复刻
  SHELL（外壳） / 工具 / CONTENT（内容） / 模板（每个 registerTemplate 一块，自带 css、knobs、notes）
  新增模板：registerTemplate({id,name,cat,mat,spell,core,tags,credit,notes,knobs,css,mount(h,ctx){...}})
  ctx：items 内容数组 · P 参数对象（旋钮实时改它）· auto 是否预览自动演示 · status/hint/focus/demo
-->
<style>
:root{--bg:#1b1b1b;--fg:#ececec;--mut:#8b8b8b;--line:#ffffff1f;--pill:#ffffff0d;--st-bg:#1e1e1e;--st-ink:#d6d6d5;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--e:cubic-bezier(.2,.8,.2,1);--io:cubic-bezier(.65,0,.35,1);--top:148px;--bot:104px}
[data-theme=light]{--bg:#e7e5e0;--fg:#151515;--mut:#6c6a65;--line:#00000024;--pill:#0000000b;--st-bg:#d6d6d5;--st-ink:#1e1e1e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{--cp-bg:#131313;--c-fg:#d6d6d5;--c-ln:#5a5a5a;--c-k:#c586c0;--c-s:#ce9178;--c-n:#b5cea8;--c-c:#6a9955;--c-f:#dcdcaa;--c-p:#9cdcfe;--c-y:#d7ba7d;--c-r:#d16969;--c-t:#569cd6;--c-a:#9cdcfe}
[data-theme=light]{--cp-bg:#f6f5f1;--c-fg:#24292e;--c-ln:#a3a3a3;--c-k:#af00db;--c-s:#a31515;--c-n:#098658;--c-c:#008000;--c-f:#795e26;--c-p:#0451a5;--c-y:#800000;--c-r:#811f3f;--c-t:#800000;--c-a:#e50000}
.cp{flex:none;border:1px solid var(--line);border-radius:18px;background:var(--cp-bg);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cp-tabs{display:flex;align-items:center;gap:4px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.cp-tabs::-webkit-scrollbar{display:none}
.cp-tabs button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;font-size:13.5px;color:var(--mut);white-space:nowrap}
.cp-tabs button::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dot,#888)}
.cp-tabs button:hover{color:var(--fg)}
.cp-tabs button[aria-pressed=true]{background:var(--line);color:var(--fg)}
.cp-tabs i{flex:none;width:1px;height:20px;background:var(--line);margin:0 6px}
.cp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font:11px var(--mono);color:var(--mut)}
.cp-bar b{color:var(--fg);font-weight:500}
.cp-bar>div{display:flex;gap:6px;flex:none}
.cp-bar button{padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:var(--pill);color:var(--fg);font:12px var(--mono);text-align:center}
.cp-bar button:hover{border-color:var(--mut)}
.cp-bar button[data-a=copy]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cp-code{max-height:min(54vh,540px);overflow:auto;padding:10px 0;font:12.5px/1.7 var(--mono);color:var(--c-fg);user-select:text;-webkit-user-select:text;counter-reset:ln;tab-size:2;outline:none}
.cl{display:flex;counter-increment:ln;min-height:1.7em}
.cl::before{content:counter(ln);flex:none;width:46px;padding-right:14px;text-align:right;color:var(--c-ln);user-select:none;-webkit-user-select:none}
.lc{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;padding-right:14px}
.lc:empty::before{content:" "}
.cp-note{padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);line-height:1.55}
.t-k{color:var(--c-k)}.t-s{color:var(--c-s)}.t-n{color:var(--c-n)}.t-c{color:var(--c-c);font-style:italic}.t-f{color:var(--c-f)}.t-p{color:var(--c-p)}.t-y{color:var(--c-y)}.t-r{color:var(--c-r)}.t-t{color:var(--c-t)}.t-a{color:var(--c-a)}
@media(max-width:520px){.cp-code{font-size:11.5px}.cl::before{width:38px;padding-right:10px}.cp-bar{flex-wrap:wrap}}
body{background:var(--bg);background-image:linear-gradient(160deg,var(--bg),var(--bg2,var(--bg)));color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ───── SHELL ───── */
.grain,.dots{position:fixed;inset:0;pointer-events:none;z-index:0}
.grain{opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.dots{opacity:.5;background-image:radial-gradient(var(--line) 1px,transparent 1.4px);background-size:7px 7px}
.nav::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.bar{position:fixed;top:74px;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:8px 14px;pointer-events:none}
.bar>*{pointer-events:auto}
.nav{display:flex;gap:2px;background:var(--pill);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;max-width:100%}
.nav button{padding:7px 13px;border-radius:7px;font-size:15px;white-space:nowrap;color:var(--mut)}
.nav button[aria-pressed=true]{background:var(--line);color:var(--fg)}
.tools{display:flex;gap:8px}
.seg{height:42px;border:1px solid var(--line);background:var(--pill);border-radius:10px}
.seg{display:flex;padding:4px;gap:2px}
.seg button{width:34px;border-radius:7px;display:grid;place-items:center;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--line);color:var(--fg)}
#stage{position:fixed;inset:0;z-index:2;overflow:hidden}
.tpl{position:absolute;inset:var(--top) 14px var(--bot) 14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 0 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto}
.hint{text-align:center;font:11px var(--mono);color:var(--mut);padding:0 14px}
.chips{display:flex;gap:6px;padding:0 14px;overflow-x:auto}
.chips::before,.chips::after{content:"";margin:auto}
.chips button{flex:none;padding:7px 12px;border:1px solid var(--line);background:var(--pill);border-radius:99px;font-size:13px;color:var(--mut);text-align:center}
.chips button:hover,.chips button.on{color:var(--fg);border-color:var(--mut)}
/* ───── 共用舞台 ───── */
.stg{position:absolute;inset:0;overflow:hidden;background:var(--st-bg);color:var(--st-ink);user-select:none;-webkit-user-select:none}
.tpl .stg{border-radius:22px;border:1px solid var(--line)}
html.embed .tpl{inset:0}
html.embed .tpl .stg{border-radius:0;border:0}
.grab{touch-action:none;cursor:grab}

/* ───── 画廊 ───── */
body.gal #stage,body.gal .dock{display:none}
.gal{position:fixed;inset:0;z-index:4;background:var(--bg);overflow:auto;padding:var(--top) 4vw 80px}
.gal[hidden]{display:none}
.gal-head h1{font-size:36px;letter-spacing:-.03em;font-weight:600}
.gal-head p{color:var(--mut);margin:6px 0 18px;font-size:15px}
.gal-search{display:flex;align-items:center;border:1px solid var(--line);background:var(--pill);border-radius:99px;padding:0 24px;height:56px;margin-bottom:14px}
.gal-search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font-size:17px;user-select:text;-webkit-user-select:text}
.gal-search input:focus-visible{outline:none}
.gal-search span{color:var(--mut);font-size:20px}
.gal-tagbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.gal-tgl{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mut);background:var(--pill)}
.gal-tgl:hover,.gal-tgl[aria-expanded=true]{color:var(--fg);border-color:var(--mut)}
.gal-tgl i{font-style:normal;font-size:11px;transition:transform .3s var(--e)}
.gal-tgl[aria-expanded=true] i{transform:rotate(180deg)}
.gal-cur{display:none;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:13px;color:var(--fg);background:var(--line)}
.gal-cur.on{display:inline-flex}
.gal-cur b{font-weight:400;opacity:.6;cursor:pointer}
.gal-tagwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--e)}
.gal-tagwrap.open{grid-template-rows:1fr}
.gal-tagwrap>.gal-tags{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .35s}
.gal-tagwrap.open>.gal-tags{visibility:visible;transition:none;padding-bottom:14px}
.gal-tags{display:flex;gap:6px;flex-wrap:wrap}
.gal-tags button{padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mut);text-align:center}
.gal-tags button[aria-pressed=true]{color:var(--fg);border-color:var(--mut);background:var(--pill)}
.gal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px;margin-top:12px}
.gal-empty{color:var(--mut);font:13px var(--mono);grid-column:1/-1}
.gc{cursor:pointer;outline:none;min-width:0}
.gc[hidden]{display:none}
.gc-pv{position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--st-bg);transition:transform .35s var(--e),border-color .2s}
.gc:hover .gc-pv,.gc:focus-visible .gc-pv{transform:translateY(-4px);border-color:var(--mut)}
.gc-fr{position:absolute;inset:0;overflow:hidden}
.gc-fr iframe{position:absolute;left:0;top:0;width:1000px;height:625px;border:0;transform-origin:0 0;transform:scale(var(--s,.4));pointer-events:none;background:var(--st-bg)}
.gc-badge,.gc-live{position:absolute;top:10px;z-index:2;font:10px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 9px;pointer-events:none}
.gc-badge{left:10px;color:var(--fg)}.gc-live{right:10px;color:var(--mut)}
.gc-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px 0}
.gc-meta h3{font-size:18px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.gc-tags{display:flex;gap:5px;overflow:hidden}
.gc-tags i{font:10px var(--mono);font-style:normal;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
.mdl{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:16px}
.mdl[hidden]{display:none}
.mdl-box{width:min(1180px,100%);max-height:96vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.mdl-box header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mdl-cat{font:11px var(--mono);color:var(--mut);margin-bottom:4px}
.mdl-t{font-size:28px;letter-spacing:-.03em;font-weight:600}
.mdl-r{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.mdl-src{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 5px;border:1px solid var(--line);background:var(--pill);border-radius:99px;font-size:13px;color:var(--fg);text-decoration:none;white-space:nowrap;min-width:0;transition:border-color .2s}
.mdl-src:hover,.mdl-src:focus-visible{border-color:var(--mut)}
.mdl-src[hidden]{display:none}
.mdl-src i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 10px var(--mono);font-style:normal;letter-spacing:-.04em}
.mdl-src small{color:var(--mut);font-size:12px}
.mdl-src span{overflow:hidden;text-overflow:ellipsis;max-width:190px}
.mdl-src b{font-weight:500;color:var(--mut);transition:transform .25s var(--e),color .2s}
.mdl-src:hover b{transform:translate(2px,-2px);color:var(--fg)}
.mdl-x{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;text-align:center}
.mdl-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.mdl-pv{position:relative;width:100%;height:min(54vh,540px);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--st-bg)}
.mdl-pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mdl-side{border:1px solid var(--line);border-radius:18px;background:var(--pill);display:flex;flex-direction:column;min-height:0;max-height:min(54vh,540px)}
.mdl-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.mdl-tabs button{flex:1;padding:7px;border-radius:9px;color:var(--mut);text-align:center;font-size:14px}
.mdl-tabs button[aria-pressed=true]{background:var(--line);color:var(--fg)}
.mdl-notes,.mdl-tune{padding:14px;overflow:auto;font-size:13.5px;line-height:1.7;user-select:text;-webkit-user-select:text}
.mdl-notes p{margin-bottom:10px}
.mdl-notes .cr{font:11px/1.6 var(--mono);color:var(--mut);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.mdl-notes a{color:var(--fg)}
.mdl-tune[hidden],.mdl-notes[hidden]{display:none}
.kn{margin-bottom:14px}
.kn label{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mut);margin-bottom:6px}
.kn label b{color:var(--fg);font-weight:500}
.kn input[type=range]{width:100%;accent-color:var(--fg)}
.kn-reset{font:11px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.mdl-spell{font-size:15px;line-height:1.6}
.mdl-tags{display:flex;gap:6px;flex-wrap:wrap}
.mdl-tags i{font:11px var(--mono);font-style:normal;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.mdl-act{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.mdl-act button{padding:11px 16px;border:1px solid var(--line);background:var(--pill);border-radius:12px;font-size:14px;text-align:center}
.mdl-act button:hover{border-color:var(--mut)}
.mdl-act button[data-a=open]{background:var(--fg);color:var(--bg);border-color:var(--fg);margin-left:auto}
html.embed .mnav,html.embed .bar,html.embed .dock,html.embed #gal,html.embed #mdl{display:none!important}
html.embed{--top:0px;--bot:0px}
@media(max-width:1200px){.gal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.mdl-main{grid-template-columns:1fr}.mdl-side{max-height:none}}
@media(max-width:860px){.gal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gc-tags{display:none}}
@media(max-width:640px){.mdl-src small,.mdl-src span{display:none}.mdl-src{padding:0 10px 0 5px}}
@media(max-width:520px){.gal-grid{grid-template-columns:1fr}.mdl-box{padding:14px}.mdl-pv{height:46vh}.mdl-act button[data-a=open]{margin-left:0}}
@media (max-width:760px){:root{--top:192px;--bot:100px}.bar .nav{order:3;width:100%}}

/* ───── 顶部栏目（参考 Meridian：分条纸片药丸）───── */
:root{--mn-a:#343434;--mn-b:#1f1f1f;--mn-ink:#f2f2f2;--mn-mut:#a5a5a5;--mn-cta:#ececec;--mn-cta-ink:#151515;--mn-sh:#00000080}
.mnav{position:fixed;z-index:8;top:10px;left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 20px));height:54px;display:flex;align-items:center;gap:14px;padding:0 8px 0 18px;border-radius:999px;overflow:hidden;color:var(--mn-ink);background:repeating-linear-gradient(90deg,var(--mn-a) 0,var(--mn-b) 46px);box-shadow:0 10px 30px var(--mn-sh),inset 0 1px 0 #ffffff40,inset 0 -1px 0 #0000001a;transition:box-shadow .4s}
.mnav::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,#ffffff2e,transparent 45%,#0000000f)}
.mnav>*{position:relative;z-index:1}
.mn-brand{display:flex;align-items:center;gap:9px;flex:none;font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.mn-ic{display:flex;gap:2.5px}
.mn-ic b{width:3px;height:14px;border-radius:2px;background:var(--mn-ink);opacity:.3}
.mn-ic b:nth-child(2){opacity:.6}.mn-ic b:nth-child(3){opacity:1}
.mn-links{flex:1;min-width:0;display:flex;justify-content:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.mn-links::-webkit-scrollbar{display:none}
.mn-links a,.mn-links button{flex:none;padding:9px 12px;border-radius:99px;font-size:12px;letter-spacing:.12em;color:var(--mn-mut);text-decoration:none;white-space:nowrap;transition:color .2s,background .2s}
.mn-links a:hover,.mn-links button:hover,.mn-links [aria-current]{color:var(--mn-ink);background:color-mix(in srgb,var(--mn-ink) 10%,transparent)}
.mn-cta{flex:none;display:flex;align-items:center;gap:9px;height:38px;padding:0 15px;border-radius:99px;background:var(--mn-cta);box-shadow:0 2px 8px #0000003a}
.mn-cta button{position:relative;width:16px;height:16px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--mn-cta-ink) 35%,transparent);transition:transform .25s var(--e),box-shadow .25s}
.mn-cta button::before{content:"";position:absolute;inset:-7px}
.mn-cta button[aria-pressed=true]{transform:scale(1.28);box-shadow:0 0 0 2px var(--mn-cta-ink)}
@media(max-width:760px){.mnav{height:50px;gap:8px;padding:0 6px 0 12px}.mn-links{justify-content:flex-start}.mn-cta{padding:0 11px;gap:7px}}
@media(max-width:560px){.mn-name{display:none}}
</style>
</head>
<body>
<div class="grain"></div><div class="dots"></div>

<nav class="mnav" aria-label="主导航">
  <button class="mn-brand" id="mbrand" aria-label="Jerry-site 首页"><span class="mn-ic" aria-hidden="true"><b></b><b></b><b></b></span><span class="mn-name">JERRY-SITE</span></button>
  <div class="mn-links">
    <button id="mhome" aria-current="page">首页</button>
    <a href="blog.html">博客</a>
    <a href="rumi.html">Rumi英语</a>
    <a href="friends.html">友链</a>
    <a href="moments.html">动态</a>
    <a href="photowall.html">照片墙</a>
    <a href="projects.html">项目</a>
    <a href="timeline.html">时间线</a>
  </div>
  <div class="mn-cta" id="msw" role="group" aria-label="切换配色"></div>
</nav>

<header class="bar">
  <nav class="nav" id="nav" aria-label="分类"></nav>
  <div class="tools">
    <div class="seg" role="group" aria-label="主题">
      <button id="tl" aria-label="浅色" aria-pressed="false">☀</button>
      <button id="td" aria-label="深色" aria-pressed="true">☾</button>
    </div>
  </div>
</header>

<main id="stage"></main>
<section class="gal" id="gal" hidden aria-label="模板画廊"></section>

<div class="mdl" id="mdl" hidden>
  <div class="mdl-box" role="dialog" aria-modal="true" aria-label="模板详情">
    <header><div><div class="mdl-cat"></div><h2 class="mdl-t"></h2></div><div class="mdl-r"><a class="mdl-src" id="msrc" target="_blank" rel="noopener noreferrer" hidden></a><button class="mdl-x" id="mx" aria-label="关闭">✕</button></div></header>
    <div class="mdl-main">
      <div class="mdl-pv"></div>
      <aside class="mdl-side">
        <div class="mdl-tabs"><button data-tab="notes" aria-pressed="true">Notes</button><button data-tab="tune" aria-pressed="false">Tune</button></div>
        <div class="mdl-notes"></div>

registerTemplate({id:'cursors',name:'Live Cursors',cat:'Interaction',mat:'在场',
spell:'打开第二个标签页 → 对方的光标带着名字滑进你的页面。',core:'别人的指针也在这一页',tags:['Interaction','Presence','Realtime'],
credit:{n:'Live Cursors',u:'https://carterogunsola.com/lab/live-cursors'},
notes:['每个访客把自己的指针以 0–1 的比例坐标广播出去，别人收到后在自己的舞台上用同样的比例还原，所以窗口大小不同也对得上。','网络位置是一阵一阵到的，直接画会瞬移。每个人保存“目标”和“已渲染”两个位置，每帧按时间无关的阻尼（1−e^(−λ·dt)）靠近目标。','每 50ms 最多发一次，静止时每 4 秒补发一次，12 秒没有消息就把光标撤掉。','这里用 BroadcastChannel 代替服务器：同一浏览器的两个标签页就能互相看到。另外放了几个“幽灵”，一个人时也能看到效果。'],
knobs:[{k:'LAMBDA',label:'平滑 λ',v:18,min:4,max:40,step:1},{k:'GHOSTS',label:'幽灵数量',v:4,min:0,max:8,step:1,remount:true}],
css:`.lc{cursor:crosshair}
.lc-cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:80%}

mount(h,ctx){
  const P=ctx.P;
  h.innerHTML=`<div class="stg lc"><div class="lc-cap"><b>Everyone else<br>on the page</b><span>在另一个标签页打开这个文件，你们会互相看见 · <i class="lc-n">1</i> ONLINE</span></div><div class="lc-layer"></div></div>`;
  const root=$('.lc',h),layer=$('.lc-layer',h),cnt=$('.lc-n',h);
  const ADJ=['Quiet','Amber','Swift','Lunar','Tidy','Mossy','Brisk','Hazy','Odd'],ANI=['Heron','Otter','Finch','Lynx','Moth','Koi','Wren','Fox','Newt'];
  const hash=s=>{let x=2166136261;for(const c of s)x=Math.imul(x^c.charCodeAt(0),16777619);return x>>>0};
  const me='p'+Math.random().toString(36).slice(2,8),peers=new Map();

  for(let k=0;k<Math.round(P.GHOSTS);k++){const g=peer('ghost-'+k+Math.random().toString(36).slice(2,5),true);g.x=g.tx=.2+Math.random()*.6;g.y=g.ty=.2+Math.random()*.6}

  root.addEventListener('pointermove',e=>{const r=root.getBoundingClientRect();mx=clamp((e.clientX-r.left)/r.width,0,1);my=clamp((e.clientY-r.top)/r.height,0,1);const now=performance.now();if(now-lastSend>50){lastSend=now;send()}});

  function go(s){if(s===state)return;state=s;setPanels(s);if(cancel)cancel();const fw=cw,fh=chh,[tw,th]=DIM[s];cancel=tween(s==='bar'?P.MORPH_OUT:P.MORPH_IN,u=>{cw=fw+(tw-fw)*u;chh=fh+(th-fh)*u},E.p3io);ctx.status(s.toUpperCase())}

  const play=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}playing=true;clearInterval(sched);sched=setInterval(note1,320);pPlayer.classList.add('playing');$('[data-a=play]',h).textContent='⏸'};

  const key=e=>{if(!h.isConnected||false)return;if(e.key==='ArrowDown'||e.key===' '){st=clamp(st+H*.5,0,maxS)}if(e.key==='ArrowUp'){st=clamp(st-H*.5,0,maxS)}};addEventListener('keydown',key);

credit:{n:'Rotating Gallery',u:'https://carterogunsola.com/lab/rotating-gallery'},

css:`.rg{--cw:200px;--ch:250px}

mount(h,ctx){

  h.innerHTML=`<div class="stg rg"><div class="rg-scene"></div><div class="rg-grid" hidden></div><button class="rg-btn">GRID</button><div class="rg-meta"><b></b><span></span></div></div>`;
  const root=$('.rg',h),scene=$('.rg-scene',h),grid=$('.rg-grid',h),btn=$('.rg-btn',h),mt=$('.rg-meta b',h),ms=$('.rg-meta span',h);
  const W=root.clientWidth,H=root.clientHeight,cw=Math.round(Math.min(H*.4,W*.17)),chh=Math.round(cw*1.25),RAD=cw*2.8;

  const cards=items.map((it,i)=>{const c=el('div','rg-card',`<div class="rg-ph" style="background-image:url(${posterURL(i,300,375)})"></div><span class="rg-n">${pad(i+1)}</span><span class="rg-t">${esc(it.title)}</span>`);scene.appendChild(c);return c});

  const setPersp=()=>{scene.style.perspective=P.PERSPECTIVE+'px';scene.style.perspectiveOrigin='50% 40%'};
  const ringT=(i,a)=>{const th=(i*SL+a)*Math.PI/180,x=Math.sin(th)*RAD,z=(Math.cos(th)-1)*RAD,y=z*P.TILT;return`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px)`};
  const layout=a=>{cards.forEach((c,i)=>{c.style.transform=ringT(i,a);const cs=Math.cos((i*SL+a)*Math.PI/180);c.style.setProperty('--d',(.78*(1-(cs+1)/2)).toFixed(3))});const act=mod(Math.round(-a/SL),N);if(act!==active){active=act;cards.forEach((c,i)=>c.classList.toggle('on',i===act));mt.textContent=items[act].title;ms.textContent=`N°${pad(act+1)} · ${items[act].kind}`;ctx.focus(act)}};
  const stop=ticker(dt=>{
    setPersp();
    if(mode==='ring'&&!flipping){
      prevA=ang;
      if(dragging)ang=damp(ang,tgt,8,dt);else{vel*=Math.exp(-P.DECAY*dt);ang+=(vel+P.AUTO_SPEED)*dt;tgt=ang}

  let lx=0;

    else{ang=tgt=-act*SL;vel=0;cards.forEach(c=>scene.appendChild(c));layout(ang)}
    root.classList.toggle('is-grid',next==='grid');if(next==='grid')cards.forEach(c=>c.style.setProperty('--d',0));
    const last=cards.map(c=>c.getBoundingClientRect()),ac=last[act],anims=[];
    cards.forEach((c,i)=>{const f=first[i],l=last[i],dx=f.left-l.left,dy=f.top-l.top,sx=f.width/l.width,sy=f.height/l.height;
      const dist=Math.hypot((l.left+l.width/2)-(ac.left+ac.width/2),(l.top+l.height/2)-(ac.top+ac.height/2)),delay=clamp(dist/W*.9,0,.6);
      const end=next==='ring'?c.style.transform:'none',start=`translate(${dx}px,${dy}px) scale(${sx},${sy})`+(next==='ring'?' '+c.style.transform:'');
      anims.push(c.animate([{transform:start},{transform:end}],{duration:P.FLIP_DUR*1000,delay:delay*1000,easing:'cubic-bezier(.68,-.55,.27,1.55)',fill:'backwards'}).finished)});
    Promise.all(anims).then(()=>{mode=next;if(next==='ring')grid.hidden=true;btn.textContent=next==='grid'?'RING':'GRID';flipping=false;ctx.status(next==='grid'?'GRID':'RING')}).catch(()=>{flipping=false});

}});

notes:['页面里有三个“版面”（索引网格、跨页、条带），它们是真实的 DOM：只有铅笔线框和一个小标签的空盒子，由浏览器排版。','一块画布盖在上面，把每张图画在“它认领的那个盒子”上。盒子用 data-print 声明“我要这张图”，引擎只负责：测量盒子的位置，让图以每帧 0.085 的跟随系数滑过去。','没有任何“网格到跨页”的动画代码。换版面就是盒子换了位置，图自己飞过去；飞行时纸面会像弯曲一样中间领先、边缘拖尾。','右边两个旋钮把两个常见的坑做成了真实的：Fetch 是假装的导航延迟，Memory 是位置缓存——关掉它，旧版面消失时图会塌缩到角落再弹出来。'],

.pu-bar button[aria-pressed=true]{opacity:1;background:var(--st-ink);color:var(--st-bg)}

.pu-box::after{content:attr(data-tag);position:absolute;left:4px;top:3px;font:9px var(--mono);opacity:.5}`,
mount(h,ctx){
  const P=ctx.P,items=ctx.items.slice(0,6),N=items.length;
  h.innerHTML=`<div class="stg pu"><div class="pu-bar"><button data-b="index" aria-pressed="true">INDEX</button><button data-b="spread" aria-pressed="false">SPREAD</button><button data-b="strip" aria-pressed="false">STRIP</button></div><div class="pu-board on" data-b="index"></div><div class="pu-board" data-b="spread"></div><div class="pu-board" data-b="strip"></div><canvas></canvas></div>`;
  const root=$('.pu',h),cv=$('canvas',h),c=cv.getContext('2d'),dpr=(EMBED&&EMBED.auto?1:Math.min(devicePixelRatio||1,2)),W=root.clientWidth,H=root.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);

  function build(){

    // index: 3x2
    const gw=(bw-2*16)/3,gh=(bh-16)/2;ids.forEach((id,i)=>box('index',id,(i%3)*(gw+16),Math.floor(i/3)*(gh+16),gw,gh));
    // spread: hero + rail
    const rest=ids.filter(i=>i!==hero),hw=bw*.5,cwid=(bw-hw-16-10)/2,rh=(bh-2*10)/3;
    box('spread',hero,0,0,hw,bh);rest.forEach((id,i)=>box('spread',id,hw+16+(i%2)*(cwid+10),Math.floor(i/2)*(rh+10),cwid,rh));
    // strip: one row
    const sw=(bw-5*10)/6,shh=Math.min(bh*.5,sw*1.25);ids.forEach((id,i)=>box('strip',id,i*(sw+10),(bh-shh)/2,sw,shh));
  }
  build();
  const imgs=items.map((_,i)=>posterCanvas(i,360,450));
  const planes=ids.map((id,i)=>({id,i,x:0,y:0,w:0,h:0,tx:0,ty:0,tw:0,th:0,vx:0,vy:0,sp:0,has:false}));
  let curB='index',lastRect={};
  function measure(){

    planes.forEach(p=>{const bx=boards[curB].querySelector(`[data-print="${p.id}"]`);let r=bx?bx.getBoundingClientRect():{left:sr.left,top:sr.top,width:0,height:0};
      if(r.width===0&&P.MEMORY>=.5&&lastRect[p.id]){p.tx=lastRect[p.id].x;p.ty=lastRect[p.id].y;p.tw=lastRect[p.id].w;p.th=lastRect[p.id].h}
      else{const ins=r.width>0?7:0;p.tx=r.left-sr.left+ins;p.ty=r.top-sr.top+ins;p.tw=Math.max(0,r.width-ins*2);p.th=Math.max(0,r.height-ins*2);if(r.width>0)lastRect[p.id]={x:p.tx,y:p.ty,w:p.tw,h:p.th}}
      if(!p.has){p.x=p.tx;p.y=p.ty;p.w=p.tw;p.h=p.th;p.has=true}});
  }
  let busy=false;
  async function setBoard(b){
    if(busy||b===curB)return;busy=true;ctx.status('→ '+b.toUpperCase());
    root.querySelectorAll('.pu-bar button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===b));
    const old=boards[curB];
    if(P.FETCH_MS>0){old.classList.remove('on');measure();await wait(P.FETCH_MS);curB=b;build();boards[b].classList.add('on');measure()}
    else{curB=b;build();boards[b].classList.add('on');old.classList.remove('on');measure()}
    busy=false;ctx.status(b.toUpperCase());
  }
  function onPrint(id){if(curB==='spread'){if(id!==hero){hero=id;build();measure();ctx.focus(ids.indexOf(id))}}else{hero=id;ctx.focus(ids.indexOf(id));build();setBoard('spread')}}
  root.querySelectorAll('.pu-bar button').forEach(b=>b.addEventListener('click',()=>setBoard(b.dataset.b)));
  measure();
  const TILES=10;
  const stop=ticker(dt=>{
    c.clearRect(0,0,W,H);

    planes.forEach(p=>{const ox=p.x+p.w/2,oy=p.y+p.h/2;p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;p.w+=(p.tw-p.w)*k;p.h+=(p.th-p.h)*k;
      const nvx=clamp(p.x+p.w/2-ox,-48,48),nvy=clamp(p.y+p.h/2-oy,-48,48);p.vx=p.vx*.8+nvx*.2;p.vy=p.vy*.8+nvy*.2;p.sp=Math.hypot(p.vx,p.vy)});
    const order=planes.slice().sort((a,b)=>a.sp-b.sp);

      for(let j=0;j<TILES;j++)for(let i=0;i<TILES;i++){
        const u=(i+.5)/TILES,v=(j+.5)/TILES,bx=(1-Math.sin(Math.PI*v))*-p.vx*P.BOW*.9,by=(1-Math.sin(Math.PI*u))*-p.vy*P.BOW*.9;
        c.drawImage(img,sx0+i*iw/TILES,sy0+j*ih/TILES,iw/TILES,ih/TILES,p.x+i*tw+bx,p.y+j*th+by,tw+1.2,th+1.2)}});
  });
  let dk=0;

  ctx.status('INDEX');

  return()=>{stop();removeEventListener('resize',measure)};
}});

mount(h,ctx){

  const root=$('.ob2',h),cv=$('canvas',h),btn=$('.ob2-mic',h),msg=$('.ob2-msg',h);

void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;

precision highp float;
out vec4 o;

float ring(float r,float r0,float w){float x=(r-r0)/w;return exp(-x*x);}

void main(){

}`;

  async function mic(){

    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ac=ac||new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(stream).connect(an);data=new Uint8Array(an.fftSize);fdata=new Uint8Array(an.frequencyBinCount);awake=true;btn.setAttribute('aria-pressed','true');btn.textContent='■ 停止';msg.textContent='LISTENING'}

  const SYS=[{n:'BLOG',d:'长文与思考记录',it:['最新文章','精选合集','归档']},{n:'VIDEO',d:'作品主阵地',it:['最新作品','系列合集','幕后']},{n:'NOTES',d:'工具与实践',it:['工具清单','教程','踩坑记录']}];
  const TABS=['我是谁','经历','反思','系统'];
  const css=(e,p,v)=>{const c=e._c||(e._c={});if(c[p]===v)return;c[p]=v;if(p[0]==='-')e.style.setProperty(p,v);else e.style[p]=v};

  root.tabIndex=0;root.style.outline='none';
  root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){go(cur+1,1);e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){go(cur-1,-1);e.preventDefault()}});
  let sx=0,sy=0;root.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;root.focus({preventScroll:true})});
  root.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1),dx<0?1:-1)});

  return()=>{stop();ro.disconnect()};
}});

.fb-f{position:relative;height:186px;perspective:800px;cursor:pointer;transition:opacity .3s,transform .3s}.fb-f.dim{opacity:.25;transform:scale(.96)}
.fb-fb{position:absolute;left:0;right:0;top:26px;bottom:0;border-radius:8px 18px 18px 18px;background:color-mix(in srgb,var(--c) 62%,#000)}.fb-fb:before{content:"";position:absolute;left:0;top:-20px;width:84px;height:24px;border-radius:9px 9px 0 0;background:color-mix(in srgb,var(--c) 62%,#000)}

.fb-cv{height:110px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 40%,#1a1d29));display:flex;align-items:flex-end;padding:12px;font-weight:800;font-size:28px;font-family:inherit;color:rgba(0,0,0,.35)}

.fb-bc{display:flex;align-items:center;gap:12px;font-size:15px}.fb-bc button{border:0;border-radius:18px;background:rgba(255,255,255,.08);color:inherit;font-weight:600;font-size:13px;font-family:inherit;padding:8px 14px;cursor:pointer}.fb-bc b{font-size:22px}
.fb-chips{margin-left:auto;display:flex;gap:10px}.fb-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.22);font-size:13px;font-weight:600;transition:all .2s}.fb-chip i{width:10px;height:10px;border-radius:3px;background:var(--c)}.fb-chip.hot{border-style:solid;border-color:var(--c);background:rgba(255,255,255,.1);transform:scale(1.08)}.fb-chip.me{opacity:.35}

@keyframes fb-in{from{opacity:0;transform:translateY(24px) scale(.94)}}
.fb-file:before{content:"";display:block;width:30px;height:38px;border-radius:5px;background:#f3f0e7;margin-bottom:12px;box-shadow:inset 0 -14px 0 var(--c)}.fb-file b{font-size:14px;line-height:1.4;display:block}.fb-file small{position:absolute;left:16px;bottom:14px;color:#8d93a8;font-size:12px}
.fb-ghost{position:absolute;z-index:60;pointer-events:none;opacity:.92;transform:rotate(4deg) scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.fb-read{position:absolute;right:0;top:0;bottom:0;width:480px;z-index:40;background:#f4f1e8;color:#23252f;padding:44px 40px;box-sizing:border-box;transform:translateX(0);transition:transform .5s cubic-bezier(.2,.9,.2,1);overflow:hidden;box-shadow:-30px 0 60px rgba(0,0,0,.4)}.fb-read[hidden]{display:block;transform:translateX(110%);visibility:hidden}
.fb-read h3{font-size:30px;line-height:1.25;margin:10px 0 8px;letter-spacing:-.02em}.fb-read small{color:#7a7c88;font-size:13px}.fb-read p{font-size:16px;line-height:1.85;color:#454856}
.fb-x{position:absolute;right:22px;top:20px;border:0;border-radius:50%;width:36px;height:36px;background:#e0dccf;font-size:16px;cursor:pointer}
.fb-toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#f5c451;color:#16130a;font-weight:700;font-size:14px;padding:11px 20px;border-radius:24px;transition:all .35s;z-index:70;pointer-events:none}.fb-toast.on{opacity:1;transform:translate(-50%,0)}`,
mount(h,ctx){
  const P=ctx.P;
  // 文件夹与文章：换成自己的数据即可（t 标题 / d 日期 / v 浏览量）
  const DATA=[
    {id:'think',name:'思维输出',c:'#f5c451',posts:[{t:'把目标写下来之前，先问一句为什么',d:'2026-09-28',v:812},{t:'去噪音比获取信息更重要',d:'2026-09-12',v:1304},{t:'第一性原理：从零开始问',d:'2026-08-30',v:655},{t:'每天只死磕一件事',d:'2026-08-11',v:498},{t:'复盘：我为什么总在换方向',d:'2026-07-21',v:377}]},
    {id:'tech',name:'技术笔记',c:'#6df27f',posts:[{t:'把 Notion 当成博客数据库',d:'2026-09-30',v:2210},{t:'静态站上线前的 5 个检查',d:'2026-09-02',v:940},{t:'把 CSS 动画写成时间的函数',d:'2026-08-19',v:1180},{t:'用 WebAudio 做一台迷你合成器',d:'2026-07-30',v:733}]},
    {id:'life',name:'日常记录',c:'#7aa7ff',posts:[{t:'周末的菜市场',d:'2026-09-21',v:301},{t:'一次失败的早起实验',d:'2026-09-05',v:422},{t:'新买的机械键盘',d:'2026-08-02',v:266}]},
    {id:'draft',name:'草稿箱',c:'#f58bb5',posts:[{t:'还没想好的标题',d:'2026-10-03',v:12},{t:'关于出海的几点想法',d:'2026-09-15',v:35}]}];
  const BODY=['这里是文章正文的示意。把你的真实内容接进来之后，阅读面板会从右侧滑出，显示标题、日期和正文。','你可以把这一段换成 Markdown 渲染结果，或者从 Notion、本地文件读取。面板本身只负责滑入滑出和排版。','拖动文件到别的文件夹可以改分类，搜索框会同时过滤三种视图。'];
  const css=(e,p,v)=>{const c=e._c||(e._c={});if(c[p]===v)return;c[p]=v;if(p[0]==='-')e.style.setProperty(p,v);else e.style[p]=v};
  const esc=s=>s.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
  h.innerHTML=`<div class="stg fb"><div class="fb-st">
    <div class="fb-hd"><b>Blog</b><small class="fb-stat"></small><input class="fb-q" placeholder="搜索文章…"><div class="fb-seg"><button data-v="0">文件夹</button><button data-v="1">列表</button><button data-v="2">图库</button></div></div>
    <div class="fb-body"></div>
    <div class="fb-open" hidden><div class="fb-bc"><button class="fb-back">← 全部</button><b class="fb-on"></b><div class="fb-chips"></div></div><div class="fb-files"></div></div>
    <aside class="fb-read" hidden><button class="fb-x">✕</button><small></small><h3></h3><div></div></aside>
    <div class="fb-toast"></div></div></div>`;
  const root=$('.fb',h),st=$('.fb-st',h),body=$('.fb-body',h),panel=$('.fb-open',h),files=$('.fb-files',h),chips=$('.fb-chips',h),rd=$('.fb-read',h),toast=$('.fb-toast',h),q=$('.fb-q',h),segs=[...h.querySelectorAll('.fb-seg button')];
  let S=1,view=P.VIEW|0,openId=null,query='',tt=0;
  const ro=new ResizeObserver(()=>{S=Math.min(root.clientWidth/1200,root.clientHeight/760);css(st,'transform',`translate(-50%,-50%) scale(${S})`)});ro.observe(root);
  const match=p=>!query||p.t.toLowerCase().includes(query);
  const say=t=>{toast.textContent=t;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1600)};
  const read=(f,p)=>{$('small',rd).textContent=f.name+' · '+p.d+' · 浏览 '+p.v;$('h3',rd).textContent=p.t;$('div',rd).innerHTML=BODY.map(x=>`<p>${esc(x)}</p>`).join('');rd.hidden=false};
  const find=el=>{const f=DATA[+el.dataset.f];return[f,f.posts[+el.dataset.p]]};
  function render(){
    segs.forEach((b,i)=>b.setAttribute('aria-pressed',i===view));
    const total=DATA.reduce((n,f)=>n+f.posts.length,0);$('.fb-stat',h).textContent=DATA.length+' 个文件夹 · '+total+' 篇';
    if(view===0){
      body.innerHTML='<div class="fb-grid">'+DATA.map((f,i)=>{const hit=f.posts.filter(match).length;
        return`<div class="fb-f${query&&!hit?' dim':''}" data-f="${i}" style="--c:${f.c}"><div class="fb-fb"></div>${f.posts.slice(0,3).map((p,k)=>`<div class="fb-sh" style="--i:${k}">${esc(p.t)}</div>`).join('')}<div class="fb-ff"><em>${query?hit+'/':''}${f.posts.length}</em><b>${esc(f.name)}</b><span>${f.posts.length} 篇文章</span></div></div>`}).join('')+'</div>';
    }else if(view===1){
      body.innerHTML='<div class="fb-list">'+DATA.map((f,i)=>{const ps=f.posts.map((p,k)=>[p,k]).filter(([p])=>match(p));return ps.length?`<div class="fb-gh" style="--c:${f.c}">${esc(f.name).toUpperCase()}</div>`+ps.map(([p,k])=>`<div class="fb-row" data-f="${i}" data-p="${k}"><b>${esc(p.t)}</b><span>${esc(f.name)}</span><span>${p.d}</span><span>👁 ${p.v}</span></div>`).join(''):''}).join('')+'</div>';
    }else{
      body.innerHTML='<div class="fb-gal">'+DATA.flatMap((f,i)=>f.posts.map((p,k)=>[f,i,p,k])).filter(([f,i,p])=>match(p)).slice(0,12).map(([f,i,p,k])=>`<div class="fb-card" data-f="${i}" data-p="${k}" style="--c:${f.c}"><div class="fb-cv">${esc(f.name)}</div><div class="fb-ct">${esc(p.t)}<small>${p.d} · 👁 ${p.v}</small></div></div>`).join('')+'</div>';
    }
  }
  function renderOpen(){
    const f=DATA[openId];$('.fb-on',h).textContent=f.name;
    chips.innerHTML=DATA.map((g,i)=>`<div class="fb-chip${i===openId?' me':''}" data-f="${i}" style="--c:${g.c}"><i></i>${esc(g.name)} · ${g.posts.length}</div>`).join('');
    files.innerHTML=f.posts.map((p,k)=>match(p)?`<div class="fb-file" data-f="${openId}" data-p="${k}" style="--c:${f.c};--n:${k}"><b>${esc(p.t)}</b><small>${p.d}</small></div>`:'').join('');
  }
  // 点击文件夹：从它的位置放大成文件面板（FLIP）
  const openFolder=(i,el)=>{
    openId=i;renderOpen();panel.hidden=false;ctx.status('OPEN · '+DATA[i].name);
    const a=el.getBoundingClientRect(),b=st.getBoundingClientRect();
    const sx=a.width/b.width,sy=a.height/b.height,dx=(a.left-b.left)/S,dy=(a.top-b.top)/S;
    panel.style.transformOrigin='0 0';
    panel.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:0},{transform:'none',opacity:1}],{duration:P.OPEN,easing:'cubic-bezier(.2,.9,.2,1)'});
  };
  const closeFolder=()=>{if(openId==null)return;const el=body.querySelector(`.fb-f[data-f="${openId}"]`);openId=null;ctx.status('ALL');
    if(!el){panel.hidden=true;return}
    const a=el.getBoundingClientRect(),b=st.getBoundingClientRect();
    const an=panel.animate([{transform:'none',opacity:1},{transform:`translate(${(a.left-b.left)/S}px,${(a.top-b.top)/S}px) scale(${a.width/b.width},${a.height/b.height})`,opacity:0}],{duration:P.OPEN*.8,easing:'cubic-bezier(.6,0,.4,1)'});
    an.onfinish=()=>{if(openId==null)panel.hidden=true}};
  segs.forEach((b,i)=>b.addEventListener('click',()=>{view=i;render()}));
  q.addEventListener('input',()=>{query=q.value.trim().toLowerCase();render();if(openId!=null)renderOpen()});
  body.addEventListener('click',e=>{const f=e.target.closest('.fb-f');if(f){openFolder(+f.dataset.f,f);return}const r=e.target.closest('[data-p]');if(r){const[g,p]=find(r);read(g,p)}});
  $('.fb-back',h).addEventListener('click',closeFolder);
  $('.fb-x',h).addEventListener('click',()=>{rd.hidden=true});
  root.tabIndex=0;root.style.outline='none';root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!rd.hidden)rd.hidden=true;else closeFolder()}});
  // 拖拽：文件卡片 → 顶部文件夹标签。移动不到 6px 算点击
  let drag=null;
  files.addEventListener('pointerdown',e=>{const el=e.target.closest('.fb-file');if(!el)return;drag={el,x:e.clientX,y:e.clientY,g:null};el.setPointerCapture(e.pointerId);root.focus({preventScroll:true})});
  files.addEventListener('pointermove',e=>{
    if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.g&&Math.hypot(dx,dy)>6){const g=drag.el.cloneNode(true);g.className='fb-file fb-ghost';g.style.cssText=`--c:${DATA[+drag.el.dataset.f].c};width:${drag.el.offsetWidth}px;height:${drag.el.offsetHeight}px;animation:none`;st.appendChild(g);drag.g=g;drag.el.style.opacity=.3}
    if(drag.g){const b=st.getBoundingClientRect();css(drag.g,'left',((e.clientX-b.left)/S-drag.el.offsetWidth/2)+'px');css(drag.g,'top',((e.clientY-b.top)/S-30)+'px');
      const t=h.ownerDocument.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.fb-chip');chips.querySelectorAll('.fb-chip').forEach(x=>x.classList.toggle('hot',x===c&&!x.classList.contains('me')))}});
  const end=e=>{
    if(!drag)return;const d=drag;drag=null;
    if(!d.g){const[g,p]=find(d.el);read(g,p);return}
    const t=h.ownerDocument.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest('.fb-chip');d.g.remove();d.el.style.opacity='';
    if(c&&!c.classList.contains('me')){const from=DATA[+d.el.dataset.f],to=DATA[+c.dataset.f],[p]=from.posts.splice(+d.el.dataset.p,1);to.posts.unshift(p);say('已移动到「'+to.name+'」');renderOpen();render()}
    else renderOpen()};
  files.addEventListener('pointerup',end);files.addEventListener('pointercancel',end);
  render();ctx.status('ALL');
  const stop=ticker(()=>{css(root,'--fan',String(P.FAN));css(root,'--lid',String(P.LID))});
  return()=>{stop();ro.disconnect();clearTimeout(tt)};
}});

  const grid=$('.gal-grid',gal),tg=$('.gal-tags',gal),tw=$('.gal-tagwrap',gal),tgl=$('.gal-tgl',gal),cur=$('.gal-cur',gal);
  const setOpen=o=>{tw.classList.toggle('open',o);tgl.setAttribute('aria-expanded',o)};
  const paintCur=()=>{cur.classList.toggle('on',!!tagF);cur.innerHTML=tagF?`${esc(tagF)} <b role="button" aria-label="清除标签" title="清除">✕</b>`:'';const x=$('b',cur);if(x)x.onclick=()=>{tagF=null;tg.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',!y.dataset.tag));paintCur();applyFilter()}};
  tgl.onclick=()=>setOpen(!tw.classList.contains('open'));
  [null,...[...new Set(TPL.flatMap(t=>t.tags))].sort()].forEach(tag=>{const b=el('button','',tag||'All');b.dataset.tag=tag||'';b.setAttribute('aria-pressed',tag===tagF);b.onclick=()=>{tagF=tag;tg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',(x.dataset.tag||null)===tagF));paintCur();setOpen(false);applyFilter()};tg.appendChild(b)});
  TPL.forEach((t,i)=>{
    const c=el('article','gc',`<div class="gc-pv"><span class="gc-badge">${t.cat} · ${t.mat}</span><span class="gc-live">● LIVE</span><div class="gc-fr" data-id="${t.id}"></div></div><div class="gc-meta"><h3>${esc(t.name)}</h3><div class="gc-tags">${t.tags.slice(0,2).map(x=>`<i>${esc(x)}</i>`).join('')}</div></div>`);
    c.tabIndex=0;c._i=i;c.setAttribute('role','button');c.setAttribute('aria-label',t.name);
    c.onclick=()=>openModal(i);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(i)}};
    grid.appendChild(c);const fr=$('.gc-fr',c);ioG.observe(fr);roG.observe(fr);
  });
  $('#gq').addEventListener('input',e=>{qF=e.target.value;applyFilter()});
}
function applyFilter(){
  const q=qF.trim().toLowerCase();let n=0;
  document.querySelectorAll('.gc').forEach(c=>{const t=TPL[c._i];
    const ok=(!catF||t.cat===catF)&&(!tagF||t.tags.includes(tagF))&&(!q||(t.name+t.spell+t.core+t.tags.join(' ')+t.cat+t.mat).toLowerCase().includes(q));
    c.hidden=!ok;if(ok)n++});
  let em=$('.gal-empty',gal);if(!n&&!em){em=el('p','gal-empty','没有匹配的模板');$('.gal-grid',gal).appendChild(em)}if(n&&em)em.remove();
  syncNav();
}
function syncNav(){document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',document.body.classList.contains('gal')?b.dataset.cat===catF:b.dataset.cat===(TPL[tIdx]||{}).cat))}
function refreshFrames(){document.querySelectorAll('.gc-fr iframe').forEach(f=>{f.srcdoc=frameDoc(f.title,true)})}
function enterGallery(){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  clearDemo();stage.innerHTML='';tIdx=-1;
  document.body.classList.add('gal');gal.hidden=false;
  syncNav();
}

/* 来源标注：弹窗右上角，按链接域名决定图标与名称 */
const SRC={'carterogunsola.com':{n:'Carter Ogunsola',m:'C'},'designspells.com':{n:'Design Spells',m:'DS'},'skillry.dev':{n:'Skillry',m:'S'},'dribbble.com':{n:'Dribbble',m:'D'},'callmiruko.cc':{n:'Jerry · callmiruko.cc',m:'J'},'github.com':{n:'GitHub',m:'G'}};
function srcOf(t){
  let host='';try{host=new URL(t.credit.u).hostname.replace(/^www\./,'')}catch(e){}
  const k=SRC[host]||{n:host||t.credit.n,m:(host||'?')[0].toUpperCase()};
  return{host,name:k.n,mono:k.m,verb:t.credit.own?'灵感来自':'复刻自',url:t.credit.u}
}
function paintSrc(t){
  const a=$('#msrc'),s=srcOf(t);if(!s.url){a.hidden=true;return}
  a.hidden=false;a.href=s.url;a.title=s.verb+' '+s.name+'（'+s.url+'）';a.setAttribute('aria-label','来源：'+s.name+'，在新标签页打开');
  a.innerHTML=`<i aria-hidden="true">${esc(s.mono)}</i><small>${s.verb}</small><span>${esc(s.name)}</span><b aria-hidden="true">↗</b>`;
}
/* 弹窗：预览 + Notes + Tune + 复制 */
function openModal(i){
  const t=TPL[i];mdlIdx=i;curParams=Object.assign({},PSTORE[t.id]||{});
  paintSrc(t);$('.mdl-cat',mdl).textContent=t.cat+' · '+t.mat;$('.mdl-t',mdl).textContent=t.name;$('.mdl-spell',mdl).textContent=t.spell;
  $('.mdl-tags',mdl).innerHTML=t.tags.map(x=>`<i>${esc(x)}</i>`).join('')+`<i>CORE:: ${esc(t.core)}</i>`;
  $('.mdl-notes',mdl).innerHTML=t.notes.map(n=>`<p>${esc(n)}</p>`).join('')+(t.credit.own?`<p class="cr">灵感方向：${t.credit.u?`<a href="${t.credit.u}" target="_blank" rel="noopener">${esc(t.credit.n)}</a>`:esc(t.credit.n)}。这是原创实现，只借用了方向与气质，不包含其源码或素材。依赖：无（原生 JS）。</p>`:`<p class="cr">复刻自 Carter Ogunsola 的 <a href="${t.credit.u}" target="_blank" rel="noopener">${esc(t.credit.n)}</a>。我只依据其公开的说明与参数自行实现，不包含其源码或素材。依赖：无（原生 JS）。</p>`);
  const tune=$('.mdl-tune',mdl);tune.innerHTML='';
  if(!(t.knobs||[]).length)tune.innerHTML='<p style="color:var(--mut)">这个模板没有可调参数。</p>';
  else{(t.knobs).forEach(k=>{const v=curParams[k.k]!=null?curParams[k.k]:k.v;const w=el('div','kn',`<label><span>${esc(k.label)}${k.remount?' ↻':''}</span><b>${v}</b></label><input type="range" min="${k.min}" max="${k.max}" step="${k.step}" value="${v}">`);
      w.dataset.k=k.k;const inp=$('input',w),out=$('b',w);inp.addEventListener('input',()=>{const nv=+inp.value;out.textContent=nv;curParams[k.k]=nv;PSTORE[t.id]=Object.assign({},curParams);scheduleCode();const f=$('.mdl-pv iframe',mdl);if(f&&f.contentWindow)f.contentWindow.postMessage({type:'tpl-param',k:k.k,v:nv,remount:!!k.remount},'*')});tune.appendChild(w)});
    const rs=el('button','kn-reset','重置参数');rs.onclick=()=>{curParams={};delete PSTORE[t.id];openModal(i);setTab('tune')};tune.appendChild(rs)}
  setTab('notes');cpRender();
  const pv=$('.mdl-pv',mdl);pv.innerHTML='';pv.appendChild(mkFrame(t.id,false,curParams));
  mdl.hidden=false;
}
function setTab(n){mdl.querySelectorAll('.mdl-tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===n));$('.mdl-notes',mdl).hidden=n!=='notes';$('.mdl-tune',mdl).hidden=n!=='tune'}
mdl.querySelectorAll('.mdl-tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function closeModal(){mdl.hidden=true;$('.mdl-pv',mdl).innerHTML='';$('.cp-code',cp).innerHTML=''}
$('#mx').onclick=closeModal;
mdl.addEventListener('click',e=>{if(e.target===mdl)closeModal()});
$('.mdl-act',mdl).addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=TPL[mdlIdx],a=b.dataset.a;
  if(a==='open'){closeModal();showTemplate(mdlIdx);return}
  if(a==='link'){copyText(location.href.split('#')[0]+'#'+t.id,b);return}
  if(a==='pen')openPen(t,Object.assign({},curParams));
});
/* 预览页接收参数 */
if(EMBED){addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='tpl-param')return;const t=TPL[tIdx];if(!t)return;PSTORE[t.id]=Object.assign(PSTORE[t.id]||{},{[m.k]:m.v});ctx0.P[m.k]=m.v;if(m.remount){clearTimeout(window._rm);window._rm=setTimeout(()=>showTemplate(tIdx,false),120)}})}

if(!EMBED){addEventListener('message',e=>{const m=e.data,f=$('.mdl-pv iframe',mdl);if(!m||m.type!=='tpl-set'||mdl.hidden||!f||e.source!==f.contentWindow)return;const t=TPL[mdlIdx];curParams[m.k]=m.v;PSTORE[t.id]=Object.assign({},curParams);const w=mdl.querySelector('.kn[data-k="'+m.k+'"]');if(w){$('input',w).value=m.v;$('b',w).textContent=m.v}scheduleCode()})}

function shuffleTemplatesByAuthor(){
  const groups=new Map();
  TPL.forEach(t=>{
    let author=t.credit.n;
    try{author=new URL(t.credit.u).hostname.replace(/^www\./,'')}catch(e){}
    if(!groups.has(author))groups.set(author,[]);
    groups.get(author).push(t);
  });
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  groups.forEach(shuffle);
  const ordered=[];let previous='';
  while(ordered.length<TPL.length){
    const candidates=[...groups].filter(([author,items])=>items.length&&author!==previous);
    if(!candidates.length)break;
    const max=candidates.reduce((n,[,items])=>Math.max(n,items.length),0);
    const best=candidates.filter(([,items])=>items.length===max);
    const [author,items]=best[Math.floor(Math.random()*best.length)];
    ordered.push(items.pop());previous=author;
  }
  TPL.splice(0,TPL.length,...ordered,...[...groups.values()].flat());
}

addEventListener('keydown',e=>{
  if(!mdl.hidden){if(e.key==='Escape')closeModal();return}
  if(e.target.tagName==='INPUT'||document.body.classList.contains('gal'))return;
  if(e.key==='PageDown')showTemplate(tIdx+1);
  if(e.key==='PageUp')showTemplate(tIdx-1);
});

/* 屏幕宽度变化（旋转屏幕）时重新排布当前模板 */
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(innerWidth-lastW)>40){lastW=innerWidth;if(tIdx>=0&&!document.body.classList.contains('gal'))showTemplate(tIdx,false)}},250)});

if(!EMBED){$('#mhome').onclick=$('#mbrand').onclick=()=>{if(!document.body.classList.contains('gal'))enterGallery();scrollTo(0,0)}}
if(EMBED){
  document.documentElement.classList.add('embed');
  showTemplate(Math.max(0,TPL.findIndex(t=>t.id===EMBED.id)),false);
}else{
  shuffleTemplatesByAuthor();
  buildGal();
  const hv=TPL.findIndex(t=>t.id===location.hash.slice(1));
  hv>=0?showTemplate(hv,false):enterGallery();
}
