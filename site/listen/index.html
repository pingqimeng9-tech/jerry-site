          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');

            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          // 随机化失败无所谓，CSS 默认值已经能跑一条波形。
        }

        // Folia 五个字母不断跳到不同字形（Loki 片头那种字体轮盘），偶尔整体落回基准样式。
        // 只用通用字族，再叠加字重、斜体和横向拉伸——不同机器上装的字体不一样，
        // 单靠字体名会退化成同一张脸，加上这几个轴才保证每次跳变都看得出来。
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var BASE_FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
          var FAMILIES = [BASE_FONT, 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui'];
          var WEIGHTS = ['400', '600', '800'];
          var SCALES = [0.86, 0.94, 1, 1.06, 1.12];
          var letters = document.querySelectorAll('#app-splash .app-splash-title span');
          if (!letters.length) {
            return;
          }

          // 用 canvas 在 100px 基准下量出每个字母在所有候选字形里的最大宽度，换算成 em 写死盒子宽度，
          // 这样字形来回换、词标整体不会左右乱跳。
          var measure = document.createElement('canvas').getContext('2d');
          for (var m = 0; m < letters.length; m += 1) {
            var glyph = letters[m].textContent;
            var widest = 0;
            for (var f = 0; f < FAMILIES.length; f += 1) {
              measure.font = 'italic 800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
              measure.font = '800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
            }
            if (widest > 0) {
              // 余量留给最大的缩放组合（1.12 × 1.12），字形放大时不会压到相邻字母。
              letters[m].style.width = ((widest / 100) * 1.26 + 0.04).toFixed(3) + 'em';
            }
          }

          var pick = function (list) {
            return list[Math.floor(Math.random() * list.length)];
          };
          var jitter = function (min, max) {
            return min + Math.random() * (max - min);
          };
          // 辉光分三档：干净、微光、过曝。片头里字母亮度参差不齐，靠这个模拟。
          var randomGlow = function () {
            var roll = Math.random();
            if (roll < 0.3) {
              return '0 0 ' + (2 + Math.random() * 4).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            if (roll < 0.75) {
              return '0 0 ' + (6 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
                (20 + Math.random() * 16).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            return '0 0 ' + (10 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.95), 0 0 ' +
              (34 + Math.random() * 20).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' +
              (70 + Math.random() * 40).toFixed(1) + 'px rgba(255,255,255,0.45)';
          };
          var timer = window.setInterval(function () {
            // 遮罩被移除后自己停掉，不留空转的定时器。
            if (!document.getElementById('app-splash')) {
              window.clearInterval(timer);
              return;
            }
            // 一拍只换一个字母，偶尔两个，节奏克制。
            var swaps = Math.random() < 0.25 ? 2 : 1;
            for (var i = 0; i < swaps; i += 1) {
              var letter = pick(letters);
              letter.style.fontFamily = pick(FAMILIES);
              letter.style.fontWeight = pick(WEIGHTS);
              letter.style.fontStyle = Math.random() < 0.25 ? 'italic' : 'normal';
              // 大小和宽窄都用 transform 做：不进入布局，盒子宽度不受影响，排版才不会抖。
              var sizeScale = jitter(0.86, 1.12);
              letter.style.transform =
                'scale(' + (sizeScale * pick(SCALES)).toFixed(3) + ',' + sizeScale.toFixed(3) + ')';
              letter.style.textShadow = randomGlow();
            }
          }, 380);
        } catch (error) {
          // 字体轮盘失败就保持静态词标。
        }
      })();
    </script>

        function fmtTime(sec) {

          var homeSearch = document.querySelector('input[placeholder*="SEARCH"], input[placeholder*="搜索"]');
          var audioNow = getAudio();

            artistEl.textContent = (trunc[1] && trunc[1].textContent) || '';
            var image = playerButton.querySelector('img');
            if (image && image.src) { cover.src = image.src; cover.style.display = ''; } else { cover.style.display = 'none'; }
          }

          var audio = getAudio();
          currentAudio = audio;
          var playing = !!audio && !audio.paused && !audio.ended;
          playBtn.innerHTML = playing ? PAUSE : PLAY;
          playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
          prevBtn.disabled = !(typeof window.__FOLIA_PREV__ === 'function' || getNavButton('prev'));
          nextBtn.disabled = !(typeof window.__FOLIA_NEXT__ === 'function' || getNavButton('next'));
          if (audio && isFinite(audio.duration) && audio.duration > 0) {
            if (!range._dragging) range.value = String(Math.round(audio.currentTime / audio.duration * 1000));
            fill.style.width = ((audio.currentTime / audio.duration) * 100).toFixed(2) + '%';

            fill.style.width = '0%';

        playBtn.addEventListener('click', function (event) {
          event.stopPropagation();

          if (!audio) return;
          if (audio.paused || audio.ended) audio.play().catch(function () {});
          else audio.pause();
          setTimeout(sync, 120);
        });
        meta.addEventListener('click', function () { var button = getPlayerButton(); if (button) button.click(); });
        openBtn.addEventListener('click', function () { var button = getPlayerButton(); if (button) button.click(); });
        prevBtn.addEventListener('click', function (event) { event.stopPropagation(); skip('prev'); });
        nextBtn.addEventListener('click', function (event) { event.stopPropagation(); skip('next'); });
        range.addEventListener('pointerdown', function () { range._dragging = true; });
        range.addEventListener('pointerup', function () { range._dragging = false; });
        range.addEventListener('input', function () {
          var audio = getAudio();
          if (!audio || !isFinite(audio.duration) || !audio.duration) return;
          audio.currentTime = Number(range.value) / 1000 * audio.duration;
          fill.style.width = (Number(range.value) / 10).toFixed(2) + '%';
        });

        var topNav = document.createElement('div');
        topNav.id = 'jerry-top-nav';
        topNav.innerHTML = '<a class="jtn-brand" href="/">callmiruko.cc</a><nav aria-label="站点导航">' +
          '<a href="/">首页</a><a href="/blog.html">博客</a><a href="/rumi.html">Rumi</a><a href="/projects.html">项目</a><a href="/friends.html">友链</a><a href="https://qishui.douyin.com/" target="_blank" rel="noopener">汽水音乐</a></nav>';
        document.body.appendChild(topNav);
        var topNavTimer = 0;
        function showTopNav() {
          if (document.body.classList.contains('folia-mobile-player')) return;
          topNav.classList.add('show');
          clearTimeout(topNavTimer);
          topNavTimer = setTimeout(function () { topNav.classList.remove('show'); }, 3200);
        }
        function hideTopNav() {
          clearTimeout(topNavTimer);
          topNav.classList.remove('show');
        }
        var navPointerY = null;
        document.addEventListener('pointerdown', function (event) {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          navPointerY = event.clientY;
        }, { passive: true });
        document.addEventListener('pointermove', function (event) {
          if (navPointerY === null) return;
          var dy = event.clientY - navPointerY;

        }, { passive: true });
        document.addEventListener('pointerup', function () { navPointerY = null; }, { passive: true });
        document.addEventListener('wheel', function (event) {
          if (event.deltaY < -6) showTopNav();

        }, { passive: true });
        setInterval(sync, 500);
        setTimeout(sync, 1200);
        window.addEventListener('resize', sync, { passive: true });

        function ensureSuiteSwitch() {
          var home = document.querySelector('.bravais-seam-home');

      })();
